[package]
name = "wicked-webflow-app"
version = "0.6.0"
description = "Desktop front end for the wwm CLI"
authors = ["Wicked Apps"]
license = "ISC"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "wicked_webflow_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The reason this app exists. `claude mcp login` refuses to start its browser
# flow without a controlling terminal, so the GUI has to supply a real pty —
# pipes are not enough. See bin/wwm:1726.
portable-pty = "0.9"
# The native folder picker. Which directory you are managing is the whole
# question `switch` answers, and typing a path is not a desktop answer to it.
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
