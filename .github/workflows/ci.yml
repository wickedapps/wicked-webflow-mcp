name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22 is the floor declared in package.json engines (Node 20 went EOL
        # 2026-04-30); 24 is Active LTS. Both run so a syntax feature newer
        # than the floor fails here rather than on a user's machine.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g @anthropic-ai/claude-code
      # Validating the directory checks marketplace.json ONLY — when both files
      # exist the marketplace wins and plugin.json is never looked at. Point at
      # the plugin manifest explicitly or it goes unchecked.
      # --strict fails on warnings, including missing metadata.
      - run: claude plugin validate . --strict
      - run: claude plugin validate .claude-plugin/plugin.json --strict
      # npm, plugin.json, marketplace.json, bin/wwm's hardcoded VERSION and the
      # Tauri crate all carry the version independently. Nothing else notices
      # when they drift, so this is the only thing standing between a typo and
      # a plugin that reports a version it isn't.
      - run: npm run version:check
